#cloud-config
packages:
  - gnupg
  - curl
  - wget

yum_repos:
  mongodb:
    baseurl: 'https://repo.mongodb.org/yum/amazon/2/mongodb-org/6.0/x86_64/'
    enabled: true
    failovermethod: priority
    gpgcheck: true
    gpgkey: 'https://pgp.mongodb.com/server-6.0.asc'
    name: MongoDB Repository
runcmd:
  - sudo yum install -y mongodb-org-6.0.15 mongodb-org-database-6.0.15 mongodb-org-server-6.0.15 mongodb-org-mongos-6.0.15 mongodb-org-tools-6.0.15
  - echo "exclude=mongodb-org,mongodb-org-database,mongodb-org-server,mongodb-mongosh,mongodb-org-mongos,mongodb-org-tools" | sudo tee -a /etc/yum.conf
  - sudo systemctl start mongod
  - sudo systemctl enable mongod
